[package]
name = "focus-lock"
version = "1.0.1"
description = "Pomodoro timer with multi-display break lock for macOS and Windows"
authors = ["OpenAI Codex"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "=1.5.1", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[dependencies]
chrono = { version = "=0.4.38", features = ["clock", "serde"] }
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
tauri = { version = "=1.6.7", features = ["api-all", "icon-png"] }

[features]
default = ["custom-protocol", "tray"]
custom-protocol = ["tauri/custom-protocol"]
tray = ["tauri/system-tray"]
