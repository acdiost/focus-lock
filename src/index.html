<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Lock</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app-shell" class="shell">

      <header class="app-header">
        <span class="app-title">Focus Lock</span>
        <span class="app-desc">番茄时钟 · 休息锁定</span>
      </header>

      <section class="hero">
        <div class="timer-card">
          <div class="timer-meta">
            <span id="phase-pill" class="pill">待机</span>
            <span id="cycle-text">今日完成 0 轮</span>
          </div>
          <div id="countdown">25:00</div>
          <p id="status-text">准备开始新的专注轮次</p>
          <p id="quote-inline"></p>
          <div class="button-row">
            <button id="start-btn" class="primary">开始番茄</button>
            <button id="pause-btn">暂停</button>
            <button id="resume-btn">继续</button>
            <button id="cancel-btn" class="danger">取消</button>
          </div>
        </div>

        <div class="quote-side">
          <p class="side-label">当前一言</p>
          <blockquote id="quote-card"></blockquote>
          <div class="reminder-band">
            <span>喝水</span>
            <span>站立</span>
            <span>远眺</span>
            <span>放松肩颈</span>
          </div>
          <p class="side-note">工作时专注，休息时离开屏幕。休息锁定页会在所有显示器上展示今日重点、一言和提醒。</p>
        </div>
      </section>

      <section class="grid">
        <article class="panel settings-panel">
          <div class="panel-head">
            <h2>节奏设置</h2>
            <p>工作与休息时长会持久化保存。</p>
          </div>
          <div class="field-grid">
            <label>
              <span>工作时长（分钟）</span>
              <input id="focus-minutes" type="number" min="1" max="180" />
            </label>
            <label>
              <span>休息时长（分钟）</span>
              <input id="break-minutes" type="number" min="1" max="60" />
            </label>
          </div>
          <div class="toggle-list">
            <label class="toggle">
              <input id="online-quote" type="checkbox" />
              <span>启用在线一言刷新</span>
            </label>
            <label class="toggle">
              <input id="water-reminder" type="checkbox" />
              <span>展示喝水提醒</span>
            </label>
            <label class="toggle">
              <input id="stand-reminder" type="checkbox" />
              <span>展示站立活动提醒</span>
            </label>
          </div>
          <button id="save-settings-btn" class="secondary">保存设置</button>
        </article>

        <article class="panel tasks-panel">
          <div class="panel-head">
            <h2>今日重要事项</h2>
            <p>最多 3 件，跨天自动清空。</p>
          </div>
          <div class="task-list">
            <input id="task-0" maxlength="60" placeholder="事项 1" />
            <input id="task-1" maxlength="60" placeholder="事项 2" />
            <input id="task-2" maxlength="60" placeholder="事项 3" />
          </div>
          <button id="save-tasks-btn" class="secondary">保存事项</button>
        </article>
      </section>

    </main>

    <section id="lock-shell" class="lock-shell" hidden>
      <div class="lock-content">
        <p class="lock-tag">休息时间</p>
        <h1 id="lock-countdown">05:00</h1>
        <p id="lock-status">离开屏幕，喝水，站起来活动一下。</p>
        <div class="lock-panels">
          <article class="lock-panel">
            <h2>今日重要事项</h2>
            <ul id="lock-tasks"></ul>
          </article>
          <article class="lock-panel">
            <h2>一言</h2>
            <blockquote id="lock-quote"></blockquote>
            <p id="lock-reminder"></p>
          </article>
        </div>
      </div>
    </section>

    <script type="module" src="./app.js"></script>
  </body>
</html>
